
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/carmovo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:654321}
    driver-class-name: com.mysql.cj.jdbc.Driver

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Lima


  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 22MB


  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:

  port: ${PORT:8080}
  forward-headers-strategy: framework

carmovo:
  panel:

    solo-local: ${CARMOVO_PANEL_SOLO_LOCAL:false}

  url-publica: ${CARMOVO_URL_PUBLICA:http://localhost:8080}
  jwt:

    secreto: ${CARMOVO_JWT_SECRETO:carmovo-clave-de-desarrollo-cambiar-en-produccion-2026}
    # Minutos que dura la sesión del cliente.
    minutos: ${CARMOVO_JWT_MINUTOS:480}
  correo:
    remitente: ${MAIL_FROM:CARMOVO <no-responder@carmovo.com>}
  dni:

    token: ${CARMOVO_DNI_TOKEN:8fdf8b92-a73a-487f-9fe0-e8e35a44f10c}

    url: ${CARMOVO_DNI_URL:https://miapi.cloud/v1/dni/{dni}}
  pagos:

    limite-yape: ${CARMOVO_LIMITE_YAPE:2000}
