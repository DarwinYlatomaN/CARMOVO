spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/carmovo_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: none 
    show-sql: true   
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080