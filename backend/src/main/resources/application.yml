# =====================================================================
# CARMOVO · Configuración
# Cada valor se puede cambiar con una VARIABLE DE ENTORNO (lo que está
# entre ${...}). Así el mismo proyecto funciona en tu PC y en internet.
# Formato: ${VARIABLE:valor_por_defecto}
# =====================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/carmovo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:654321}
    driver-class-name: com.mysql.cj.jdbc.Driver

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Lima

  # Archivos del panel: imágenes (máx. 2 MB) y video de portada (máx. 20 MB)
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 22MB

  # Correo (opcional). Si MAIL_HOST está vacío, los correos se muestran en la consola.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  # Los servicios en la nube (Railway, Render) indican el puerto con PORT.
  port: ${PORT:8080}
  forward-headers-strategy: framework

carmovo:
  # Dirección pública del sitio (se usa en los enlaces de los correos).
  url-publica: ${CARMOVO_URL_PUBLICA:http://localhost:8080}
  jwt:
    # En producción define CARMOVO_JWT_SECRETO (mínimo 32 caracteres).
    secreto: ${CARMOVO_JWT_SECRETO:carmovo-clave-de-desarrollo-cambiar-en-produccion-2026}
    # Minutos que dura la sesión del cliente.
    minutos: ${CARMOVO_JWT_MINUTOS:480}
  correo:
    remitente: ${MAIL_FROM:CARMOVO <no-responder@carmovo.com>}
  dni:

    token: 8fdf8b92-a73a-487f-9fe0-e8e35a44f10c

    url: ${CARMOVO_DNI_URL:https://miapi.cloud/v1/dni/{dni}}
  pagos:

    limite-yape: ${CARMOVO_LIMITE_YAPE:2000}
