<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloPagina}">Mis servicios | CARMOVO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/variables.css}">
    <link rel="stylesheet" th:href="@{/css/admin/base.css}">
    <link rel="stylesheet" th:href="@{/css/admin/componentes/barra-lateral.css}">
    <link rel="stylesheet" th:href="@{/css/admin/componentes/panel-ui.css}">
    <link rel="stylesheet" th:href="@{/css/admin/paginas/mis-servicios.css}">
    <script defer th:src="@{/js/admin/servicios/admin-api.cliente.js}"></script>
    <script defer th:src="@{/js/admin/guardias/rol.guardia.js}"></script>
    <script defer th:src="@{/js/admin/componentes/barra-lateral.js}"></script>
    <script defer th:src="@{/js/admin/principal.js}"></script>
    <script defer th:src="@{/js/admin/paginas/mis-servicios.pagina.js}"></script>
</head>
<body data-pagina="mis-servicios">
<div class="app-admin">
    <aside id="barraLateral"></aside>
    <div class="overlay-admin" id="overlayAdmin"></div>
    <div class="contenido-admin">
        <header class="cabecera-admin">
            <div class="cabecera-admin__izquierda">
                <button class="boton-menu-admin" id="btnMenuAdmin" type="button" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
                <div><div class="cabecera-admin__titulo">Mis servicios</div><div class="cabecera-admin__subtitulo" id="fechaAdmin">Servicios con chofer asignados</div></div>
            </div>
        </header>
        <main class="pagina-admin">
            <section class="pu-encabezado">
                <div>
                    <h1>Mis servicios</h1>
                    <p>Los alquileres con chofer que te asignaron. Marca cada paso al avanzar: en camino, entregado al cliente y finalizado.</p>
                </div>
                <div class="pu-acciones">
                    <button class="pu-boton pu-boton--suave" id="ms-recargar" type="button"><i class="fa-solid fa-rotate"></i> Actualizar</button>
                </div>
            </section>
            <div class="pu-pestanas" role="tablist">
                <button type="button" class="activa" data-filtro="activos" role="tab">Por atender</button>
                <button type="button" data-filtro="finalizados" role="tab">Finalizados</button>
            </div>
            <section class="ms-lista" id="ms-lista" aria-live="polite"><div class="pu-tarjeta">Cargando…</div></section>
        </main>
    </div>
</div>
<div id="pu-mensaje" class="pu-mensaje" role="status" aria-live="polite" hidden></div>
</body>
</html>
