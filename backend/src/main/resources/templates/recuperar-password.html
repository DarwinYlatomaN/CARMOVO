<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloPagina}">Recuperar Contraseña | Carmovo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/paginas/recuperar-password.css" th:href="@{/css/paginas/recuperar-password.css}">
</head>
<body>
    <div class="pantalla-centrada">
        <div class="tarjeta-recuperacion">
            <div class="cabecera-recuperacion">
                <a href="/" th:href="@{/}">
                    <img src="/recursos/imagenes/home/logo-carmovo4.jpg" th:src="@{/recursos/imagenes/home/logo-carmovo4.jpg}" alt="Logo Carmovo" class="logo-recuperacion">
                </a>
                <h1 class="titulo-recuperacion">Recuperar Contraseña</h1>
                <p class="subtitulo-recuperacion">Ingresa tu correo y te enviaremos las instrucciones</p>
            </div>

            <div id="mensajeExito" class="mensaje-exito-oculto" role="status">
                <i class="fa-solid fa-circle-check"></i>
                <p id="textoExito">Si el correo está registrado, recibirás un enlace para restablecer tu contraseña. Revisa también tu carpeta de spam.</p>
            </div>

            <p id="mensajeError" class="mensaje-error-recuperacion" role="alert" hidden></p>

            <!-- Paso 1: pedir el enlace -->
            <form id="formularioRecuperacion" class="formulario-acceso" novalidate>
                <div class="grupo-input">
                    <label for="correoRecuperacion">Correo Electrónico</label>
                    <div class="campo-input-recuperacion">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="correoRecuperacion" placeholder="ejemplo@correo.com" autocomplete="email" required>
                    </div>
                </div>

                <button type="submit" class="boton-accion-naranja boton-bloque">
                    Enviar enlace <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>

            <!-- Paso 2: crear la nueva contraseña (se muestra al abrir el enlace del correo) -->
            <form id="formularioNuevaContrasena" class="formulario-acceso" novalidate hidden>
                <div class="grupo-input">
                    <label for="nuevaContrasena">Nueva contraseña</label>
                    <div class="campo-input-recuperacion">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="nuevaContrasena" placeholder="Mínimo 8 caracteres" minlength="8" maxlength="72" autocomplete="new-password" required>
                    </div>
                </div>
                <div class="grupo-input">
                    <label for="confirmarContrasena">Confirmar contraseña</label>
                    <div class="campo-input-recuperacion">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmarContrasena" placeholder="Repite tu contraseña" autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="boton-accion-naranja boton-bloque">
                    Guardar contraseña <i class="fa-solid fa-check"></i>
                </button>
            </form>

            <div class="pie-recuperacion">
                <p><a href="/login" th:href="@{/login}" class="enlace-login"><i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión</a></p>
            </div>
        </div>
    </div>

    <script src="/js/servicios/api.cliente.js" th:src="@{/js/servicios/api.cliente.js}"></script>
    <script src="/js/paginas/recuperar-password.js" th:src="@{/js/paginas/recuperar-password.js}"></script>
    <script src="/js/paginas/portal.publico.js" th:src="@{/js/paginas/portal.publico.js}"></script>
</body>
</html>
