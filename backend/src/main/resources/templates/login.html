<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloPagina}">Iniciar Sesión | Carmovo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/paginas/login.css" th:href="@{/css/paginas/login.css}">
</head>
<body>
    <div class="pantalla-centrada container-fluid">
        <div class="tarjeta-login">
            <a href="/" th:href="@{/}" class="btn-volver" aria-label="Volver al inicio">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div class="cabecera-login">
                <a href="/" th:href="@{/}">
                    <img src="/recursos/imagenes/home/logo-carmovo4.jpg" th:src="@{/recursos/imagenes/home/logo-carmovo4.jpg}" alt="Logo Carmovo" class="logo-login">
                </a>
                <h1 class="titulo-login">Iniciar Sesión</h1>
                <p class="subtitulo-login">Ingresa tus datos para continuar con tu reserva</p>
            </div>

            <form id="formularioLogin"
                  class="formulario-acceso needs-validation"
                  th:action="@{/login}"
                  th:object="${loginForm}"
                  method="post">
                <div class="grupo-input">
                    <label for="correo">Correo Electrónico</label>
                    <div class="campo-input-login">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" class="form-control" th:field="*{correo}" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <div class="campo-input-login">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" class="form-control" th:field="*{password}" placeholder="Ingresa tu contraseña" required>
                        <button type="button" class="btn-mostrar-password" id="btnMostrarPassword">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="alert alert-danger py-2 mb-0" role="alert" th:if="${errorLogin}" th:text="${errorLogin}">
                    Correo o contraseña incorrectos.
                </div>

                <div class="opciones-extra">
                    <label class="checkbox-recordar">
                        <input type="checkbox">
                        <span>Recordarme</span>
                    </label>
                    <a href="/recuperar-password" th:href="@{/recuperar-password}" class="enlace-olvido">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="boton-accion-naranja boton-bloque btn">
                    Ingresar a mi cuenta <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="pie-login">
                <p>¿Aún no tienes una cuenta? <a href="/registro" th:href="@{/registro}" class="enlace-registro">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

    <script th:if="${usuarioAutenticado != null}" th:inline="javascript">
        const usuarioThymeleaf = {
            logueado: true,
            idUsuario: /*[[${usuarioAutenticado.idUsuario}]]*/ null,
            nombre: /*[[${usuarioAutenticado.nombres + ' ' + usuarioAutenticado.apellidos}]]*/ '',
            nombres: /*[[${usuarioAutenticado.nombres}]]*/ '',
            apellidos: /*[[${usuarioAutenticado.apellidos}]]*/ '',
            correo: /*[[${usuarioAutenticado.correo}]]*/ '',
            telefono: /*[[${usuarioAutenticado.telefono}]]*/ '',
            perfil: /*[[${usuarioAutenticado.nombrePerfil}]]*/ 'Cliente'
        };
        localStorage.setItem('carmovo_sesion', JSON.stringify(usuarioThymeleaf));
        localStorage.setItem('usuarioCarmovoLogueado', 'true');
        window.location.replace('/reservas');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/servicios/api.cliente.js" th:src="@{/js/servicios/api.cliente.js}"></script>
    <script src="/js/paginas/login.js" th:src="@{/js/paginas/login.js}"></script>
</body>
</html>
