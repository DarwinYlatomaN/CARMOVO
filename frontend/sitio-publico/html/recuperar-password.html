<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Carmovo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/paginas/recuperar-password.css">
</head>
<body>
    <div class="pantalla-centrada">
        <div class="tarjeta-recuperacion">
            <div class="cabecera-recuperacion">
                <a href="home.html">
                    <img src="../recursos/imagenes/home/logo-carmovo4.jpg" alt="Logo Carmovo" class="logo-recuperacion">
                </a>
                <h1 class="titulo-recuperacion">Recuperar Contraseña</h1>
                <p class="subtitulo-recuperacion">Ingresa tu correo y te enviaremos las instrucciones</p>
            </div>

            <div id="mensajeExito" class="mensaje-exito-oculto">
                <i class="fa-solid fa-circle-check"></i>
                <p>Hemos enviado un enlace de recuperación a tu correo electrónico.</p>
            </div>

            <form id="formularioRecuperacion" class="formulario-acceso">
                <div class="grupo-input">
                    <label for="correoRecuperacion">Correo Electrónico</label>
                    <div class="campo-input-recuperacion">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="correoRecuperacion" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <button type="submit" class="boton-accion-naranja boton-bloque">
                    Enviar enlace <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>

            <div class="pie-recuperacion">
                <p><a href="login.html" class="enlace-login"><i class="fa-solid fa-arrow-left"></i> Volver al inicio de sesión</a></p>
            </div>
        </div>
    </div>

    <script src="../js/paginas/recuperar-password.js"></script>
</body>
</html>
