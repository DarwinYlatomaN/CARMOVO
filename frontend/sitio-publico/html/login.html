<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Carmovo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/paginas/login.css">
</head>
<body>
    <div class="pantalla-centrada">
        <div class="tarjeta-login">
            
            <!-- NUEVO: Botón de regresar -->
            <a href="home.html" class="btn-volver" aria-label="Volver al inicio">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div class="cabecera-login">
                <a href="home.html">
                    <img src="../recursos/imagenes/home/logo-carmovo4.jpg" alt="Logo Carmovo" class="logo-login">
                </a>
                <h1 class="titulo-login">Iniciar Sesión</h1>
                <p class="subtitulo-login">Ingresa tus datos para continuar con tu reserva</p>
            </div>

            <form id="formularioLogin" class="formulario-acceso">
                <div class="grupo-input">
                    <label for="correo">Correo Electrónico</label>
                    <div class="campo-input-login">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <div class="campo-input-login">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                        <button type="button" class="btn-mostrar-password" id="btnMostrarPassword">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="opciones-extra">
                    <label class="checkbox-recordar">
                        <input type="checkbox">
                        <span>Recordarme</span>
                    </label>
                    <a href="recuperar-password.html" class="enlace-olvido">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="boton-accion-naranja boton-bloque">
                    Ingresar a mi cuenta <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="pie-login">
                <p>¿Aún no tienes una cuenta? <a href="registro.html" class="enlace-registro">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

    <script src="../js/paginas/login.js"></script>
</body>
</html>
